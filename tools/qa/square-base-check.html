<!doctype html><meta charset="utf-8"><title>Square-base regression</title>
<style>body{font:14px system-ui;margin:12px}iframe{width:100%;height:650px;border:0}pre{white-space:pre-wrap;max-height:55px;overflow:auto}</style>
<button id="run">Load and check crane</button><button id="collapse">Collapse at 50%</button><button id="end">Collapse at 100%</button><button id="left">Left guide at 50%</button><button id="finish">Last step at 100%</button>
<pre id="report">Ready</pre><iframe id="app" src="../../origami-3d.html"></iframe>
<script type="module">
import {makeSheet,compileActions,poseSequence} from '../../simulator/src/action-fold.js';
const frame=document.querySelector('#app'),report=document.querySelector('#report');
const pause=ms=>new Promise(r=>setTimeout(r,ms));
async function show(i,t){const w=frame.contentWindow,d=w.document;d.querySelectorAll('#actionList .lesson-step')[i].click();await pause(30);d.querySelector('#stepScrub').value=t;d.querySelector('#stepScrub').dispatchEvent(new Event('input'));}
document.querySelector('#run').onclick=async()=>{try{
 const w=frame.contentWindow;await w.StepStudio.craneLesson();const data=w.StepStudio.tutorialData(),f=data.fold,vs=f.vertices_coords;
 report.textContent=JSON.stringify({state:w.StepStudio.getState(),bounds:vs[0].map((_,i)=>[Math.min(...vs.map(v=>v[i])),Math.max(...vs.map(v=>v[i]))]),faces:f.faces_vertices.length},null,2);
 const seq=compileActions(makeSheet(data.paper||f),data.actions);let n=0;
 for(let i=0;i<data.actions.length;i++)for(const t of [0,.25,.5,.75,1]){
  const faces=poseSequence(seq,i,t);if(!faces.every(f=>f.vertices.every(v=>v.p.every(Number.isFinite))))throw Error('Nonfinite pose');n++;
 }
 report.textContent+='\nPASS '+n+' poses; '+data.actions.length+' steps';
 const saved=JSON.parse(JSON.stringify(data));w.StepStudio.load(saved);
 if(w.StepStudio.getState().steps!==data.actions.length)throw Error('Reload lost tutorial actions');
 const rebuilt=compileActions(makeSheet(saved.paper||saved.fold),saved.actions);
 if(JSON.stringify(rebuilt.frames.at(-1))!==JSON.stringify(seq.frames.at(-1)))throw Error('Reload changed the folded paper');
 report.textContent+='\nPASS save / load retains the exact paper and final pose';
 await w.StepStudio.craneLesson();await show(8,50);
}catch(e){report.textContent+='\nFAIL '+e.stack;}};
document.querySelector('#collapse').onclick=()=>show(8,50);document.querySelector('#end').onclick=()=>show(8,100);
document.querySelector('#left').onclick=()=>show(9,50);document.querySelector('#finish').onclick=()=>show(14,100);
</script>
