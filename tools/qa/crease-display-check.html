<!doctype html><meta charset="utf-8"><title>Crease display regression</title>
<style>body{font:14px system-ui}iframe{width:100%;height:760px;border:0}pre{white-space:pre-wrap}</style>
<button id="run">Run display checks</button><pre id="report">Ready</pre><iframe src="../../origami-3d.html"></iframe>
<script type="module">
const wait=ms=>new Promise(r=>setTimeout(r,ms)),assert=(ok,m)=>{if(!ok)throw Error(m);};
document.querySelector('#run').onclick=async()=>{
 const iframe=document.querySelector('iframe'),w=iframe.contentWindow,d=w.document,$=id=>d.getElementById(id),report=document.querySelector('#report'),log=[];
 const scrub=p=>{$('stepScrub').value=p;$('stepScrub').dispatchEvent(new w.Event('input'));};
 const change=value=>{$('creaseView').value=value;$('creaseView').dispatchEvent(new w.Event('change'));};
 const colored=()=>{const out=[];w.G.threeView.scene.traverse(o=>{if(o.visible&&o.type==='LineSegments'&&[0xc15b52,0x507db5].includes(o.material.color.getHex()))out.push(o);});return out;};
 try{
  report.textContent='Running';for(let i=0;i<200&&(!w.StepStudio||w.importBusy);i++)await wait(100);
  $('browseTutorials').click();assert([...d.querySelectorAll('#tutorialLibrary .study-button')].every(b=>w.getComputedStyle(b).backgroundColor==='rgb(255, 255, 255)'),'Neutral cards');
  $('craneLesson').click();for(let i=0;i<200&&w.StepStudio.getState().steps!==33;i++)await wait(100);
  assert(w.StepStudio.getState().steps===33,'Crane loaded');
  [...d.querySelectorAll('#actionList button')].at(-1).click();scrub(100);
  assert($('creaseView').value==='current','Current fold default');assert(colored().length===0,'Completed whole-paper turn does not color old creases');
  const data=JSON.stringify(w.StepStudio.tutorialData());change('all');assert(colored().length===2,'All M/V available');
  for(const o of colored())assert(o.material.depthTest&&!o.material.depthWrite,'Lines respect paper depth and do not obscure later lines');
  change('none');assert(colored().length===0,'Paper-only view');assert(JSON.stringify(w.StepStudio.tutorialData())===data,'Display options do not change authored geometry');
  log.push('PASS final crane: current/all/paper-only modes, depth and unchanged lesson');
  change('current');d.querySelector('#actionList button').click();scrub(60);assert(colored().length>0,'Current fold is highlighted');
  $('clearPaperLayers').click();scrub(70);assert(colored().length>0,'Highlights survive clarity toggle');
  $('separatePaper').click();assert(colored().length>0,'Highlights survive separated layers');$('separatePaper').click();
  log.push('PASS active crease display with layer clarity and inspection');
  for(const [width,height]of [[390,740],[614,510],[1024,768]]){
   iframe.style.width=width+'px';iframe.style.height=height+'px';await wait(200);
   const scene=$('threeContainer').getBoundingClientRect(),player=$('lessonPlayer').getBoundingClientRect(),select=$('creaseView').getBoundingClientRect();
   assert(scene.height>60&&scene.bottom<=player.top+1,'Canvas remains above controls at '+width);assert(select.right<=w.innerWidth&&select.left>=0,'Crease selector fits '+width);
  }
  log.push('PASS neutral library and 390/614/1024 layouts');report.textContent=log.join('\n')+'\nALL PASS';
 }catch(e){report.textContent=log.join('\n')+'\nFAIL '+e.stack;}finally{w.StepStudio?.exit();}
};
</script>
