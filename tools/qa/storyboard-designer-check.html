<!doctype html><meta charset="utf-8"><title>Storyboard Designer and SVG handoff</title>
<style>body{font:14px system-ui}iframe{width:100%;height:850px;border:1px solid #ddd}pre{white-space:pre-wrap}</style>
<button id="run">Run designer and handoff checks</button><pre id="report">Ready</pre><iframe id="app" src="../../studio-v2.html"></iframe>
<script type="module">
const pause=ms=>new Promise(r=>setTimeout(r,ms)),assert=(ok,m)=>{if(!ok)throw Error(m);};
document.querySelector('#run').onclick=async()=>{
 const frame=document.querySelector('#app'),report=document.querySelector('#report'),log=[],keys=['cp-designer-lines','foldlab.author-draft.v1','foldlab.storyboard.previous-draft'],saved=keys.map(k=>localStorage.getItem(k));let w=frame.contentWindow,d=w.document;
 const $=id=>d.getElementById(id);async function until(fn,ms=30000){const t=performance.now();while(!fn()){if(performance.now()-t>ms)throw Error('Timed out: '+fn);await pause(70);}}
 try{
  report.textContent='Running';await until(()=>w.Storyboard?.page==='design'&&w.CPDesignerRuntime?.cp.lines.length);await pause(100);
  assert(d.querySelector('.story-header'),'Actual V2 design header');assert(w.getComputedStyle(d.querySelector('.story-nav a:last-child')).display!=='none','Make tutorial is reachable');
  const R=w.CPDesignerRuntime;R.cp.lines=[{p1:{x:-200,y:-200},p2:{x:200,y:200},lt:'mountain'},{p1:{x:-200,y:200},p2:{x:200,y:-200},lt:'valley'},{p1:{x:0,y:-200},p2:{x:0,y:200},lt:'crease'}];R.cp.paperShape='square';R.cp.sourcePreset=null;R.saveToLocal();R.render();
  d.querySelector('.cfab-header').click();await pause(100);assert(d.querySelectorAll('.cs-icon').length===9&&[...d.querySelectorAll('.cs-icon')].every(n=>w.getComputedStyle(n).display!=='none'),'Constraint symbols are restored');assert(d.querySelectorAll('.zoom-ctrl .zc-btn svg').length===2,'Magnifier zoom controls');
  $('lt-mountain').click();assert($('lt-mountain').classList.contains('mountain-active'),'Crease tool works');d.querySelector('[data-cs="parallel"]').click();assert(d.querySelector('[data-cs="parallel"]').classList.contains('active'),'Drawing constraint works');d.querySelector('[data-cs="off"]').click();
  d.querySelector('[data-cs="parallel"]').click();R.getSnapCandidates();const before=R.snapStats(),r=R.canvas.getBoundingClientRect();for(let i=0;i<150;i++)R.canvas.dispatchEvent(new w.MouseEvent('mousemove',{bubbles:true,clientX:r.left+100+i%70,clientY:r.top+140+i%40}));await pause(80);const after=R.snapStats();assert(after.builds===before.builds,'Pointer motion reuses cached intersections');assert(after.renderedFrames-before.renderedFrames<=2,'Pointer redraws are coalesced');d.querySelector('[data-cs="off"]').click();log.push('PASS constraint icons, magnifier controls and 150 pointer events without rebuilding intersections');
  const select=[...d.querySelectorAll('.pro-btn')].find(b=>b.textContent==='Select');select.click();assert($('canvasWrap').classList.contains('pro-mode'),'Selection tool works');select.click();
  let output;const original=w.HTMLAnchorElement.prototype.click;w.HTMLAnchorElement.prototype.click=function(){output=fetch(this.href).then(r=>r.text());};try{w.exportSVG();}finally{w.HTMLAnchorElement.prototype.click=original;}assert(output,'SVG download triggered');const svg=await output;assert(svg.includes('<svg')&&svg.includes('#ff0000')&&svg.includes('#0000ff'),'Export retains assigned fold colors');
  log.push('PASS real Designer tools, constraints, selection and SVG export');
  for(const [width,height]of [[1440,900],[800,600],[390,844]]){frame.style.width=width+'px';frame.style.height=height+'px';await pause(200);if(width===390)$('storyDesignTools').click();const paper=$('cpCanvas').getBoundingClientRect(),header=d.querySelector('.story-header').getBoundingClientRect(),status=$('cpBar').getBoundingClientRect(),zoom=d.querySelector('.zoom-ctrl').getBoundingClientRect();assert(paper.width>200&&paper.height>150,'Usable drawing canvas '+width);assert(header.right<=w.innerWidth+1,'Header fits '+width);assert(status.left>=0&&status.right<=w.innerWidth+1&&status.bottom<=w.innerHeight+1,'Complete bottom status '+width);assert(zoom.bottom>=paper.bottom-110&&zoom.bottom<=paper.bottom,'Zoom controls sit low in the canvas '+width);assert(d.documentElement.scrollWidth<=w.innerWidth+1,'No horizontal overflow '+width);}
  frame.style.width='1200px';frame.style.height='850px';await pause(150);
  const nextLoad=new Promise(resolve=>frame.onload=resolve);d.querySelector('.simulation-launch').click();await nextLoad;w=frame.contentWindow;d=w.document;await until(()=>w.Storyboard?.page==='fold'&&!w.importBusy&&!w.sessionStorage.getItem('origami.storyboard.handoff'));
  assert(w.location.pathname.endsWith('/fold-lab-v2.html'),'Actual navigation reaches V2 Fold Lab');const fold=w.G.pattern.getFoldData(true);assert(fold.faces_vertices.length>0&&fold.vertices_coords.every(p=>p.every(Number.isFinite)),'Imported SVG has valid paper faces');
  $('storyMakeTutorial').click();$('storyStartPattern').click();await pause(150);assert(w.StepStudio.getState().active,'Imported paper can start a tutorial');assert($('paperEditor').querySelectorAll('polygon').length>0,'Imported paper remains visible in authoring');
  log.push('PASS 1440/800/390 Designer layouts');log.push('PASS actual Designer → SVG → V2 navigation → 3D import → tutorial paper');
  const designLoad=new Promise(resolve=>frame.onload=resolve);frame.src='../../studio-v2.html';await designLoad;w=frame.contentWindow;d=w.document;await until(()=>w.Storyboard?.page==='design');const makeLoad=new Promise(resolve=>frame.onload=resolve);d.querySelector('.story-nav [data-mode=create]').click();await makeLoad;w=frame.contentWindow;d=w.document;await until(()=>w.Storyboard?.page==='fold'&&!w.importBusy&&$('storyStart')?.open);assert(w.location.search==='?view=create','Designer Make tutorial reaches the create view');$('storyStartPattern').click();await pause(120);assert(w.StepStudio.getState().active&&w.StepStudio.tutorialData().fold.edges_assignment.includes('M')&&w.StepStudio.tutorialData().fold.edges_assignment.includes('V'),'Make tutorial carries the current Designer M/V drawing');log.push('PASS Designer Make tutorial carries the current drawing into the centered start dialog');report.textContent=log.join('\n')+'\nALL PASS';
 }catch(e){report.textContent=log.join('\n')+'\nFAIL '+e.stack;}finally{w.StepStudio?.stop();await pause(500);keys.forEach((k,i)=>saved[i]===null?localStorage.removeItem(k):localStorage.setItem(k,saved[i]));}
};
</script>
