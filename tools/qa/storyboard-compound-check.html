<!doctype html><meta charset="utf-8"><title>Storyboard compound workflow checks</title>
<style>body{font:14px system-ui}iframe{width:100%;height:820px;border:0}pre{white-space:pre-wrap}</style>
<button id="run">Run V2 compound checks</button><pre id="report">Ready</pre><iframe src="../../fold-lab-v2.html"></iframe>
<script type="module">
import {pocketLesson,reversePractice} from '../../simulator/src/pocket-lessons.js';
const wait=ms=>new Promise(r=>setTimeout(r,ms)),assert=(ok,msg)=>{if(!ok)throw Error(msg);};
document.querySelector('#run').onclick=async()=>{
 let w=document.querySelector('iframe').contentWindow,d=w.document;const $=id=>d.getElementById(id),report=document.querySelector('#report'),log=[],key='foldlab.author-draft.v1',saved=localStorage.getItem(key);
 const change=(node,value)=>{node.value=value;node.dispatchEvent(new w.Event('change'));},scrub=t=>{const n=$('stepScrub');n.value=t*100;n.dispatchEvent(new w.Event('input'));},state=()=>w.StepStudio.getState();
 async function until(fn,ms=15000){const start=performance.now();while(!fn()){if(performance.now()-start>ms)throw Error('Timed out: '+fn);await wait(50);}}
 try{
  report.textContent='Running';await until(()=>w.StepStudio&&!w.importBusy);
  $('browseTutorials').click();$('foldPracticeLibrary').open=true;await Promise.all([...d.querySelectorAll('.practice-card img')].map(i=>i.decode()));$('pocketPractice').click();$('storySettings').click();assert(state().steps===7&&!$('tutorialLibrary').open,'Pocket practice opens');
  d.querySelectorAll('.lesson-step')[4].click();$('copyLesson').click();assert(state().steps===5,'Copy through preparation');$('moreMoves').open=true;$('squashMotion').click();$('storyMotionOptions').open=true;assert(state().phase==='preview','Squash is authorable: '+$('actionMessage').textContent);assert(d.querySelectorAll('#motionStages button').length===3,'Three stages shown');assert(!$('stageTeaching').hidden,'Stage timing is editable');
  const rows=[...d.querySelectorAll('.stage-teaching-row')];for(const row of rows)change(row.querySelector('input[type=number]'),'.4');const pause=rows[0].querySelector('input[type=checkbox]');pause.checked=true;pause.dispatchEvent(new w.Event('change'));change(rows[0].querySelector('input[type=text]'),'Open the joined pockets gently.');
  change($('playbackSpeed'),'2');scrub(0);$('replayAction').click();await until(()=>Math.abs(state().progress-1/3)<1e-5&&$('replayAction').textContent==='Play');await wait(100);assert(Math.abs(state().progress-1/3)<1e-5,'Stage checkpoint holds');assert($('motionCue').textContent.includes('Open the joined pockets gently.'),'Paused instruction belongs to finished stage');
  d.querySelectorAll('#motionStages button')[1].click();await until(()=>Math.abs(state().progress-2/3)<1e-5&&$('replayAction').textContent==='Play');assert(state().position===-1,'Stage replay stays in current draft');$('saveAction').click();const squash=w.StepStudio.tutorialData().actions[5];assert(squash.stages[0].pauseAfter&&squash.stages[0].instruction==='Open the joined pockets gently.','Timing, instruction and pause saved');log.push('PASS author squash, per-stage timing/instruction, checkpoint and stage-only replay');
  $('moreMoves').open=true;$('openSinkMotion').click();assert(state().phase==='preview','Sink is authorable');change($('sinkDepth'),'35');assert($('compoundMotionError').textContent==='','Sink depth accepted');$('saveAction').click();assert(w.StepStudio.tutorialData().actions[6].depth===.35,'Actual sink depth saved');
  d.querySelectorAll('.lesson-step')[6].click();$('editSavedMotion').click();change($('sinkDepth'),'30');
  let downloaded;const click=w.HTMLAnchorElement.prototype.click;w.HTMLAnchorElement.prototype.click=function(){downloaded=fetch(this.href).then(r=>r.json());};try{$('saveLesson').click();}finally{w.HTMLAnchorElement.prototype.click=click;}assert(downloaded,'Download triggered');const data=await downloaded;assert(data.actions[6].depth===.3&&data.actions[5].stages[0].pauseAfter,'Portable file includes edited depth and stages');w.StepStudio.load(data);assert(state().steps===7,'Portable file loads');log.push('PASS author sink, depth editing, Save tutorial and reopen');
  w.StepStudio.load(reversePractice());d.querySelectorAll('.lesson-step')[1].click();$('editSavedMotion').click();$('previewAction').click();assert(state().phase==='preview','Non-square-base reverse is editable: '+$('actionMessage').textContent);$('saveAction').click();assert(w.StepStudio.tutorialData().actions[1].frontRegions.length,'Reverse keeps material wall regions');log.push('PASS independent triangular-point lesson and reverse authoring');
  w.StepStudio.load({...pocketLesson(),actions:[]});$('copyLesson').click();$('openSinkMotion').click();assert(state().phase==='define'&&$('actionMessage').textContent.includes('waterbomb'),'Unsupported input gives preparation instruction');assert(!$('practicePocketHelp').hidden,'Practice is one click away');log.push('PASS incompatible paper rejected with actionable help');
  w.StepStudio.load(data);d.querySelectorAll('.lesson-step')[6].click();$('editSavedMotion').click();change($('sinkDepth'),'28');change(d.querySelector('.stage-teaching-row input[type=text]'),'A saved sink stage');await wait(450);
  await new Promise(resolve=>{const f=document.querySelector('iframe');f.onload=resolve;w.location.reload();});w=document.querySelector('iframe').contentWindow;d=w.document;await until(()=>w.StepStudio&&!w.importBusy);$('restoreDraft').click();assert(state().phase==='preview','Compound draft restored');assert($('sinkDepth').value==='28','Draft depth restored');assert(d.querySelector('.stage-teaching-row input[type=text]').value==='A saved sink stage','Stage instruction restored');log.push('PASS unfinished compound action survives reload');
  for(const [width,height]of [[390,740],[614,510],[1024,768]]){const f=document.querySelector('iframe');f.style.width=width+'px';f.style.height=height+'px';await wait(300);const scene=$('threeContainer').getBoundingClientRect(),player=$('lessonPlayer').getBoundingClientRect();assert(scene.height>60&&scene.bottom<=player.top+1,'Paper stays visible above stage controls at '+width+' (height '+scene.height+')');assert(player.left>=0&&player.right<=w.innerWidth+1,'Player fits '+width);}
  log.push('PASS stage controls fit mobile, compact and desktop layouts');report.textContent=log.join('\n')+'\nALL PASS';
 }catch(e){report.textContent=log.join('\n')+'\nFAIL '+e.stack;}finally{w.StepStudio?.exit();await wait(400);if(saved===null)localStorage.removeItem(key);else localStorage.setItem(key,saved);}
};
</script>
