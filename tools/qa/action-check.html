<!doctype html><meta charset="utf-8"><title>Fold Lab regression check</title>
<style>body{font:14px system-ui;margin:20px}iframe{width:1100px;height:760px;border:1px solid #ddd}pre{white-space:pre-wrap}.pass{color:#176b46}.fail{color:#a32b24}</style>
<h1>Fold Lab regression check</h1><pre id="report">Running…</pre><iframe id="app" src="../../origami-3d.html"></iframe>
<script type="module">
import {makeSheet,compileActions,poseSequence} from '../../simulator/src/action-fold.js';
const report=document.querySelector('#report'),frame=document.querySelector('#app');let passed=0;report.textContent='';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));const assert=(value,msg)=>{if(!value)throw Error(msg);};
async function until(fn){for(let i=0;i<180;i++){if(fn())return;await sleep(100);}throw Error('Timed out');}
async function test(name,fn){try{await fn();passed++;report.textContent+='PASS '+name+'\n';}catch(e){report.className='fail';report.textContent+='FAIL '+name+': '+e.message+'\n';throw e;}}
try{
 await until(()=>frame.contentWindow.StepStudio&&frame.contentWindow.G?.model?.getNodes().length&&!frame.contentWindow.importBusy);
 const w=frame.contentWindow,d=w.document;
 await test('Camera begins in CP orientation and fits the actual canvas',async()=>{const cam=w.G.threeView.camera;assert(Math.abs(cam.position.x)<1e-7,'rotated default');const el=d.querySelector('#threeContainer');assert(Math.abs(cam.aspect-el.clientWidth/el.clientHeight)<.01,'wrong canvas aspect');});
 await test('Flat Crane builds six editable precrease and unfold actions',async()=>{await w.StepStudio.craneLesson();assert(w.StepStudio.getState().steps===6,'missing lesson');const data=w.StepStudio.tutorialData();assert(data.fold.vertices_coords.length>10,'not Flat Crane');const sequence=compileActions(makeSheet(data.fold),data.actions);for(let i=0;i<data.actions.length;i++)for(const t of [0,.25,.5,1])assert(poseSequence(sequence,i,t).every(f=>f.vertices.every(v=>v.p.every(Number.isFinite))),'non-finite pose');const final=sequence.frames.at(-1);assert(final.every(f=>f.vertices.every(v=>Math.hypot(v.p[0]-v.uv[0],v.p[1]-v.uv[1],v.p[2])<1e-5)),'unfold did not restore sheet');w.StepStudio.exit();});
 await test('Saved action tutorial reloads without losing the actions',async()=>{const data=JSON.parse(JSON.stringify(w.StepStudio.tutorialData()));w.StepStudio.load(data);assert(w.StepStudio.getState().steps===6,'reload lost steps');assert(!d.querySelector('#actionCanvas').hidden,'missing full-size editor');w.StepStudio.exit();});
 await test('CP Designer SVG adapter imports grouped styles and black boundary',async()=>{const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="-220 -220 440 440"><rect x="-200" y="-200" width="400" height="400" fill="white" stroke="#ccc"/><g stroke="#3B82F6"><line x1="-200" y1="-200" x2="200" y2="200"/></g></svg>';assert(await w.importModelSource({name:'designer-regression.svg',text:svg}),'import rejected');assert(w.G.pattern.getFoldData(true).edges_assignment.includes('V'),'lost valley');w.StepStudio.activate();assert(!d.querySelector('#actionCanvas').hidden,'paper missing in editor');w.StepStudio.exit();});
 await test('Narrow tutorial layout keeps the canvas above its controls',async()=>{frame.style.width='390px';await sleep(150);w.StepStudio.activate();for(const selector of ['#actionCanvas','#stepStudio']){const r=d.querySelector(selector).getBoundingClientRect();assert(r.width>300&&r.left>=0&&r.right<=391,'clipped '+selector);}assert(d.querySelector('#actionCanvas').getBoundingClientRect().bottom<=d.querySelector('#stepStudio').getBoundingClientRect().top+1,'overlapping editor');w.StepStudio.exit();frame.style.width='1100px';});
 await test('Archived version 1 editor loads an existing-format tutorial',async()=>{frame.src='../../archive/legacy-pages/tutorial-v1.html';await sleep(100);await until(()=>frame.contentWindow.StepStudio?.setPatternFromSimulator&&frame.contentWindow.G?.model?.getNodes().length&&!frame.contentWindow.importBusy);const old=frame.contentWindow.StepStudio;const data=old.tutorialData();assert(data.version===1&&data.segments.length>0,'missing legacy renderer');old.load(data);assert(old.getState().active,'legacy tutorial not visible');old.exit();});
 report.className='pass';report.textContent+='DONE: '+passed+' passed';
}catch(e){report.textContent+='\nStopped: '+e.stack;}
</script>
