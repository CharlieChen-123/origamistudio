<!doctype html><meta charset="utf-8"><title>Tutorial usability regression</title>
<style>body{font:14px system-ui}iframe{width:100%;height:820px;border:0}pre{white-space:pre-wrap}</style>
<button id="run">Run tutorial usability checks</button><pre id="report">Ready</pre><iframe id="app" src="../../origami-3d.html"></iframe>
<script type="module">
import {airplaneLesson,rectanglePaper} from '../../simulator/src/example-lessons.js';
import {craneActions} from '../../simulator/src/crane-lesson.js';
import {compileActions,makeSheet,poseAction} from '../../simulator/src/action-fold.js';
const pause=ms=>new Promise(r=>setTimeout(r,ms)),assert=(ok,m)=>{if(!ok)throw Error(m);};
document.querySelector('#run').onclick=async()=>{
 let w=document.querySelector('iframe').contentWindow,d=w.document;const $=id=>d.getElementById(id),report=document.querySelector('#report'),log=[],saved=localStorage.getItem('foldlab.author-draft.v1');
 try{report.textContent='Running';for(let i=0;i<200&&(!w.StepStudio||w.importBusy);i++)await pause(100);
 assert(w.StepStudio,'Studio initialized');
 assert(w.ORIGAMI_PRESETS.find(p=>p.id==='originalBird').difficulty===2,'Bird is Level 2');assert(w.ORIGAMI_PRESETS.every((p,i,all)=>!i||p.difficulty>=all[i-1].difficulty),'Preset level order');
 assert(!$('panel').querySelector('.study-button'),'No example lesson buttons in sidebar');$('browseTutorials').click();assert($('tutorialLibrary').open,'Library opens');$('airplaneLesson').click();assert(!$('tutorialLibrary').open&&w.StepStudio.getState().steps===9,'Example opens and closes library');log.push('PASS library, viewer, Bird ordering');
 const plane=airplaneLesson();w.StepStudio.load(plane);d.querySelectorAll('.lesson-step')[7].click();$('editSavedMotion').click();$('openLayerPicker').click();
 assert($('layerPicker').open,'Exploded picker opens');assert(d.querySelectorAll('#explodedLayers g').length===4,'Four material flaps shown');assert(d.querySelectorAll('#explodedLayerList input:checked').length===2,'Both upper wing layers selected');
 $('layerSpacing').value='80';$('layerSpacing').dispatchEvent(new w.Event('input'));$('applyPaperLayers').click();assert(!$('layerPicker').open,'Selection confirmed');assert(d.querySelectorAll('.destination-ghost').length,'Destination shown on paper');$('previewAction').click();assert(w.StepStudio.getState().phase==='preview','Multi-layer preview');$('saveAction').click();assert(w.StepStudio.tutorialData().actions[7].seeds.length===2,'Layer selection persisted');log.push('PASS exploded layers → destination → preview → save');
 const paper=rectanglePaper(400,400),actions=craneActions({x:0,y:0,w:400,h:400}),crane={format:'fold-lab-tutorial',version:2,title:'Crane edit QA',fold:paper,paper,actions};
 for(const index of [15,27]){w.StepStudio.load(crane);d.querySelectorAll('.lesson-step')[index].click();$('editSavedMotion').click();assert(!$('previewAction').disabled,'Compound motion is editable');$('previewAction').click();assert(w.StepStudio.getState().phase==='preview','Compound preview '+index+': '+$('actionMessage').textContent);$('saveAction').click();const updated=w.StepStudio.tutorialData();assert(updated.actions[index].frontRegions?.length,'Explicit material regions saved');const actual=compileActions(makeSheet(paper),updated.actions).frames[index+1],expected=compileActions(makeSheet(paper),actions).frames[index+1];for(const f of actual)for(const v of f.vertices){const q=expected.flatMap(f=>f.vertices).find(q=>Math.hypot(...q.uv.map((x,k)=>x-v.uv[k]))<1e-5);if(q)assert(Math.hypot(...q.p.map((x,k)=>x-v.p[k]))<1e-4,'Edited compound geometry preserved');}}
 log.push('PASS petal / reverse saved-motion editing and downstream validation');
 w.StepStudio.load({...crane,actions:[]});$('rotateOnTable').click();$('paperTurnAngle').value='90';$('paperTurnAngle').dispatchEvent(new w.Event('change'));$('savePreviewView').click();$('saveAction').click();assert(w.StepStudio.tutorialData().actions[0].angle===90,'Turn angle saved');assert(w.StepStudio.tutorialData().actions[0].view,'Recommended camera saved');d.querySelector('.lesson-step').click();$('restoreStepView').click();assert(JSON.stringify(w.G.friendlyView.capture())===JSON.stringify(w.StepStudio.tutorialData().actions[0].view),'Recommended camera restored');log.push('PASS physical paper turn and independent recommended camera');
 w.StepStudio.load(plane);d.querySelectorAll('.lesson-step')[7].click();$('editSavedMotion').click();$('customFoldAngle').value='62';$('customFoldAngle').dispatchEvent(new w.Event('change'));$('previewAction').click();$('reviewTitle').value='Two layers at 62 degrees';$('savePreviewView').click();$('reviewTitle').dispatchEvent(new w.Event('input'));await pause(400);
 const view=JSON.parse(localStorage.getItem('foldlab.author-draft.v1')).form.draft.view;
 await new Promise(resolve=>{const iframe=document.querySelector('iframe');iframe.onload=resolve;w.location.reload();});w=document.querySelector('iframe').contentWindow;d=w.document;
 for(let i=0;i<200&&(!w.StepStudio||w.importBusy);i++)await pause(100);$('restoreDraft').click();assert(w.StepStudio.getState().phase==='preview','Preview restored');assert($('actionAngle').value==='62','Custom angle restored');assert($('reviewTitle').value==='Two layers at 62 degrees','Title restored');assert(JSON.stringify(w.G.friendlyView.capture())===JSON.stringify(view),'Preview camera restored');$('editAction').click();$('openLayerPicker').click();assert(d.querySelectorAll('#explodedLayerList input:checked').length===2,'Multi-layer selection survives reload');$('applyPaperLayers').click();log.push('PASS unfinished multi-layer edit: custom angle, camera and title survive real reload');
 report.textContent=log.join('\n')+'\nALL PASS';
 }catch(e){report.textContent=log.join('\n')+'\nFAIL '+e.stack;}finally{w.StepStudio?.exit();await pause(400);if(saved===null)localStorage.removeItem('foldlab.author-draft.v1');else localStorage.setItem('foldlab.author-draft.v1',saved);}
};
</script>
