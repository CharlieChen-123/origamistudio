<!doctype html><meta charset="utf-8"><title>Direct motion and teaching workflow</title>
<style>body{font:14px system-ui}iframe{width:1280px;height:800px;border:0}pre{white-space:pre-wrap}body.inspect{margin:0;overflow:hidden}body.inspect>:not(iframe){display:none}body.inspect iframe{width:100vw!important;height:100vh!important}</style>
<button id="run">Check direct editing and teaching</button><button id="inspect" onclick="document.body.classList.add('inspect')">Inspect result</button><pre id="report">Ready</pre><iframe src="../../fold-lab-v2.html"></iframe>
<script type="module">
import {rectanglePaper} from '../../simulator/src/example-lessons.js';
import {makeSheet,compileActions,poseAction} from '../../simulator/src/action-fold.js';
import {resolveAnchor} from '../../simulator/src/teaching-tools.js';
const pause=ms=>new Promise(r=>setTimeout(r,ms)),assert=(x,m)=>{if(!x)throw Error(m);};
document.querySelector('#run').onclick=async()=>{
 const frame=document.querySelector('iframe'),w=frame.contentWindow,d=w.document,$=id=>d.getElementById(id),keys=['foldlab.author-draft.v1','foldlab.storyboard.previous-draft'],saved=keys.map(k=>localStorage.getItem(k)),report=document.querySelector('#report'),logs=[];
 const until=async fn=>{for(let i=0;i<300;i++){if(fn())return;await pause(50);}throw Error('Timed out');};
 const presentation=()=>w.StepStudio.getPresentation(),scrub=t=>{w.StepStudio.stop();$('stepScrub').value=t*100;$('stepScrub').dispatchEvent(new w.Event('input'));};
 const change=(id,value)=>{$(id).value=String(value);$(id).dispatchEvent(new w.Event('change',{bubbles:true}));};
 const initial=makeSheet(rectanglePaper(400,400)),radius=Math.hypot(400,400)/2;
 const projected=point=>{const v=new w.THREE.Vector3((point[0]-200)/radius,point[2]/radius,(point[1]-200)/radius).project(w.G.threeView.camera),r=w.G.threeView.renderer.domElement.getBoundingClientRect();return {clientX:r.left+(v.x+1)*r.width/2,clientY:r.top+(1-v.y)*r.height/2};};
 const paperClick=(uv,t=presentation().progress)=>{const a=presentation().draft||presentation().actions[presentation().position],prepared=compileActions(initial,[a]).prepared[0],point=resolveAnchor({uv},poseAction(prepared,t));$('paperTeachingOverlay').dispatchEvent(new w.PointerEvent('pointerdown',{...projected(point),button:0,pointerId:71,bubbles:true}));};
 try{
  report.textContent='Running';await until(()=>w.Storyboard&&!w.importBusy);
  const paper=rectanglePaper(400,400),fold={kind:'fold',axis:[[200,0],[200,400]],side:1,angle:90,title:'Lift the flap',caption:'Lift the left half.',duration:.5};
  w.StepStudio.load({format:'fold-lab-tutorial',version:2,title:'Teaching a fold',fold:paper,paper,actions:[fold]});w.StepStudio.stop();await pause(200);$('editSavedMotion').click();$('previewAction').click();scrub(1);await pause(350);
  assert(!$('directMotionReview').hidden,'Moving-paper review is available');$('inspectMovingPaper').click();assert($('inspectMovingPaper').getAttribute('aria-pressed')==='true','Moving-region inspection toggles');
  $('editOnPaper').click();await pause(80);assert(d.querySelectorAll('[data-handle]').length===3,'Two axis handles and one tip handle are available');
  const before=structuredClone(presentation().draft),handle=d.querySelector('[data-handle=axis0]'),start=projected([200,0,0]),destination=projected([175,0,0]);
  handle.dispatchEvent(new w.PointerEvent('pointerdown',{...start,button:0,pointerId:72,bubbles:true}));$('paperTeachingOverlay').dispatchEvent(new w.PointerEvent('pointermove',{...destination,pointerId:72,bubbles:true}));$('paperTeachingOverlay').dispatchEvent(new w.PointerEvent('pointerup',{...destination,pointerId:72,bubbles:true}));await pause(100);
  assert(Math.abs(presentation().draft.axis[0][0]-175)<.01,'Dragging a fold-line handle updates the actual axis');
  $('resetMotionAdjustments').click();assert(JSON.stringify(presentation().draft.axis)===JSON.stringify(before.axis),'Reset restores the original axis');
  const tip=compileActions(initial,[presentation().draft]).prepared[0].pieces.filter(f=>f.moving).flatMap(f=>f.vertices).sort((a,b)=>Math.abs(b.p[0]-200)-Math.abs(a.p[0]-200))[0],tipStart=projected(resolveAnchor({uv:tip.uv},poseAction(compileActions(initial,[presentation().draft]).prepared[0],1))),tipEnd=projected([200+(tip.p[0]-200)*.5,tip.p[1],-(tip.p[0]-200)*Math.sqrt(3)/2]);
  d.querySelector('[data-handle=angle]').dispatchEvent(new w.PointerEvent('pointerdown',{...tipStart,button:0,pointerId:73,bubbles:true}));$('paperTeachingOverlay').dispatchEvent(new w.PointerEvent('pointermove',{...tipEnd,pointerId:73,bubbles:true}));$('paperTeachingOverlay').dispatchEvent(new w.PointerEvent('pointerup',{...tipEnd,pointerId:73,bubbles:true}));assert(Math.abs(Math.abs(presentation().draft.angle)-60)<.01,'Dragging the tip follows its constrained fold arc');
  change('directAngle',60);assert(Math.abs(presentation().draft.angle)===60,'Angle adjustment changes geometry');
  const angleHandle=d.querySelector('[data-handle=angle]');angleHandle.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));assert(Math.abs(presentation().draft.angle)===65,'Handle keyboard adjustment works');
  $('compareMotion').click();assert($('compareMotion').getAttribute('aria-pressed')==='true','Original comparison is available');$('compareMotion').click();assert(Math.abs(presentation().draft.angle)===65,'Comparison preserves edited geometry');$('resetMotionAdjustments').click();$('finishDirectEdit').click();
  $('editOnPaper').click();await pause(80);const validAxis=JSON.stringify(presentation().draft.axis),badStart=projected([200,0,0]),badEnd=projected([200,400,0]);d.querySelector('[data-handle=axis0]').dispatchEvent(new w.PointerEvent('pointerdown',{...badStart,button:0,pointerId:74,bubbles:true}));$('paperTeachingOverlay').dispatchEvent(new w.PointerEvent('pointermove',{...badEnd,pointerId:74,bubbles:true}));$('paperTeachingOverlay').dispatchEvent(new w.PointerEvent('pointerup',{...badEnd,pointerId:74,bubbles:true}));assert(JSON.stringify(presentation().draft.axis)===validAxis,'Invalid axis rolls back instead of damaging the motion');assert(!$('motionRecovery').hidden&&$('motionRecoveryAction').textContent,'Invalid edit has a correction action');$('dismissMotionRecovery').click();$('finishDirectEdit').click();
  logs.push('PASS moving-region review, pointer axis and tip edits, angle/keyboard adjustment, compare/reset and invalid-edit recovery');

  scrub(.5);$('teachingEditor').open=true;$('addPaperLabel').click();paperClick([50,100]);assert($('teachingNoteDialog').open,'Paper click opens a contextual label form');$('teachingNoteText').value='Keep these edges aligned';change('teachingNoteStart',10);change('teachingNoteEnd',90);$('saveTeachingMark').click();assert(!$('teachingNoteDialog').open,'Label form saves');
  assert(presentation().draft.teaching.marks.length===1,'Label saved on the draft');await pause(80);const markPosition=()=>d.querySelector('[data-teaching-mark="0"] circle')?.getAttribute('cx');const first=markPosition();scrub(.75);await pause(80);assert(markPosition()!==first,'Label follows its material point during folding');scrub(0);await pause(80);assert(!d.querySelector('[data-teaching-mark="0"]'),'Label is hidden before its authored range');scrub(.5);
  $('addPaperArrow').click();paperClick([50,250]);paperClick([300,250]);assert($('teachingNoteDialog').open,'Two paper clicks define an arrow');$('teachingNoteText').value='Bring the flap toward this edge';$('saveTeachingMark').click();
  assert(presentation().draft.teaching.marks.length===2,'Arrow and label coexist');logs.push('PASS material-attached labels/arrows, authored visibility range and folding tracking');

  $('addTeachingCheckpoint').click();change('teachingCueAt',50);$('teachingCueText').value='Pause and check the flap';$('chooseTeachingFocus').click();paperClick([50,100],.5);assert($('teachingCueDialog').open&&!$('teachingFocusZoomLabel').hidden,'A paper point defines the detail view');$('saveTeachingCue').click();assert(presentation().draft.teaching.cues.length===1,'Checkpoint saved');
  $('saveAction').click();assert(!presentation().draft,'Edited step saved');assert(w.StepStudio.tutorialData().actions[0].teaching.marks.length===2,'Marks survive saving the motion');w.StepStudio.selectStep(0);scrub(0);await pause(100);const fullView=w.G.friendlyView.capture();$('replayAction').click();await until(()=>Math.abs(w.StepStudio.getState().progress-.5)<1e-8&&$('replayAction').textContent==='Play');
  assert(!$('continueTeachingCheckpoint').hidden,'Playback stops at the authored checkpoint');assert(w.G.friendlyView.capture().zoom>fullView.zoom,'The checkpoint focuses its saved detail');$('returnTeachingFullView').click();assert(Math.abs(w.G.friendlyView.capture().zoom-fullView.zoom)<1e-6,'Full view restores the prior framing');$('continueTeachingCheckpoint').click();await until(()=>w.StepStudio.getState().progress===1);logs.push('PASS exact checkpoint pause, anchored detail view, full-view restore and resume');
  const exported=JSON.parse(JSON.stringify(w.StepStudio.tutorialData()));w.StepStudio.load(exported);scrub(.5);await pause(150);assert(d.querySelectorAll('[data-teaching-mark]').length===2,'Portable reopen restores marks');assert($('teachingCheckpoints').querySelectorAll('button').length===1,'Portable reopen restores checkpoints');
  $('editSavedMotion').click();$('previewAction').click();scrub(.5);assert(presentation().draft.teaching.marks.length===2,'Re-editing saved motion retains teaching content');$('saveAction').click();w.StepStudio.selectStep(0);scrub(.5);logs.push('PASS save/reopen and subsequent motion edits preserve teaching content');
  for(const [width,height]of [[1440,900],[1024,768],[800,600],[390,844]]){frame.style.width=width+'px';frame.style.height=height+'px';await pause(120);assert(d.documentElement.scrollWidth<=w.innerWidth+1,'No page horizontal overflow '+width);assert($('stepStudio').scrollWidth<=$('stepStudio').clientWidth+1,'No inspector horizontal overflow '+width);}
  frame.style.width='1280px';frame.style.height='800px';await pause(150);logs.push('PASS responsive authoring at 1440/1024/800/390');report.textContent=logs.join('\n')+'\nALL PASS';
 }catch(e){report.textContent=logs.join('\n')+'\nFAIL '+e.stack;}finally{w.StepStudio?.stop();await pause(500);keys.forEach((k,i)=>saved[i]===null?localStorage.removeItem(k):localStorage.setItem(k,saved[i]));}
};
</script>
