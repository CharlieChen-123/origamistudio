<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-220 -220 440 440" width="440" height="440">
  <!-- Origami Crease Pattern — 7 lines — Export from CP Designer -->
  <!-- Paper shape: square -->
  <rect x="-200" y="-200" width="400" height="400" fill="#FAF8F2" stroke="#ccc" stroke-width="1"/>

  <!-- Mountain folds (solid red) -->
  <g stroke="#EF4444" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="none" fill="none">
    <line x1="-200.00" y1="-200.00" x2="200.00" y2="200.00" data-lt="mountain"/>
    <line x1="50.00" y1="50.00" x2="200.00" y2="75.00" data-lt="mountain"/>
    <line x1="-50.00" y1="-50.00" x2="-75.00" y2="-200.00" data-lt="mountain"/>
    <line x1="100.00" y1="-200.00" x2="200.00" y2="-100.00" data-lt="mountain"/>
  </g>

  <!-- Valley folds (dashed blue) -->
  <g stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="8,4" fill="none">
    <line x1="-200.00" y1="100.00" x2="-100.00" y2="200.00" data-lt="valley"/>
    <line x1="50.00" y1="50.00" x2="75.00" y2="200.00" data-lt="valley"/>
    <line x1="-50.00" y1="-50.00" x2="-200.00" y2="-75.00" data-lt="valley"/>
  </g>
</svg>
