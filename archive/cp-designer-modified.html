<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>折纸设计工坊 · Origami Crease Pattern Designer</title>
<style>
/* ═══════════════════════════════════════════
   设计令牌 (Design Tokens) — 语义色，满足 WCAG AA
   ═══════════════════════════════════════════ */
:root{
  /* 中性色 */
  --bg: #F6F4EF;            /* 页面背景（暖纸色） */
  --surface: #FFFFFF;       /* 卡片表面 */
  --surface-2: #FBF9F4;     /* 次级表面 */
  --border: #E3DED3;        /* 边框 */
  --border-strong: #C9C2B4; /* 强调边框 */
  --ink: #211D17;           /* 主文字（对比度 ≥12:1） */
  --ink-2: #5C554A;         /* 次级文字（对比度 ≈7:1） */
  --ink-3: #8A8274;         /* 弱化文字（仅用于装饰/禁用） */
  --ink-on-accent: #FFFFFF;

  /* 品牌色 */
  --primary: #2F5D8F;       /* 主操作（对比度白字 ≈6:1） */
  --primary-hover: #264E7A;
  --primary-soft: #E4EDF6;  /* 主色浅底 */
  --accent: #C25E3C;        /* 强调/危险（折纸橙） */

  /* 折痕语义色（折纸社区标准：蓝=谷折 红=山折 灰=引导） */
  --fold-valley: #1F6FD6;
  --fold-mountain: #D64541;
  --fold-crease: #6E6A61;
  --fold-valley-soft: #DCEBFA;
  --fold-mountain-soft: #FBE4E2;

  /* 圆角与阴影 */
  --r: 12px; --r-sm: 8px;
  --shadow-sm: 0 1px 2px rgba(33,29,23,0.06);
  --shadow-md: 0 4px 16px rgba(33,29,23,0.08);
  --shadow-lg: 0 12px 40px rgba(33,29,23,0.14);

  /* 间距（8pt 节奏） */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;

  /* 字体 */
  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', Consolas, monospace;
}

/* ═══════════════════════════════════════════
   基础
   ═══════════════════════════════════════════ */
*,*::before,*::after{ box-sizing: border-box; margin: 0; padding: 0; }
html,body{ height: 100%; }
body{
  font-family: var(--font-ui);
  font-size: 16px; line-height: 1.5;
  background: var(--bg); color: var(--ink);
  display: flex; flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button{ font-family: inherit; font-size: 15px; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, canvas:focus-visible{
  outline: 3px solid var(--primary-soft); outline-offset: 2px;
}

/* ═══════════════════════════════════════════
   顶栏
   ═══════════════════════════════════════════ */
header{
  height: 60px; flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 var(--sp-5);
  gap: var(--sp-4);
  box-shadow: var(--shadow-sm);
  z-index: 20;
}
.brand{ display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
.brand-icon{
  width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--primary), #4C7FB0);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(47,93,143,0.25);
}
.brand-icon svg{ stroke: #fff; fill: none; }
.brand-name{ font-weight: 700; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
.brand-sub{ font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.header-actions{ margin-left: auto; display: flex; align-items: center; gap: var(--sp-2); }

/* 按钮 */
.btn{
  min-height: 40px; padding: 0 var(--sp-4);
  border-radius: var(--r-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--ink);
  font-weight: 500;
  display: inline-flex; align-items: center; gap: var(--sp-2);
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover{ background: var(--surface-2); border-color: var(--ink-3); }
.btn:active{ transform: scale(0.98); }
.btn.primary{ background: var(--primary); border-color: var(--primary); color: var(--ink-on-accent); }
.btn.primary:hover{ background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.icon-btn{ width: 40px; padding: 0; justify-content: center; }
.btn.danger{ color: var(--accent); }
.btn:disabled{ opacity: .45; cursor: not-allowed; transform: none; }

/* 下拉菜单 */
.dropdown{ position: relative; }
.dropdown-menu{
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 200;
  min-width: 200px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--shadow-lg);
  padding: var(--sp-2);
  display: none;
  animation: pop .15s ease;
}
.dropdown.open .dropdown-menu{ display: block; }
@keyframes pop{ from{ opacity:0; transform: translateY(-4px);} to{ opacity:1; transform:none;} }
.menu-item{
  width: 100%; min-height: 40px;
  display: flex; align-items: center; gap: var(--sp-3);
  padding: 0 var(--sp-3);
  border: none; background: transparent; border-radius: var(--r-sm);
  color: var(--ink); font-weight: 500; text-align: left;
}
.menu-item:hover{ background: var(--surface-2); }
.menu-item svg{ color: var(--ink-2); flex-shrink: 0; }
.menu-divider{ height: 1px; background: var(--border); margin: var(--sp-2) 0; }

/* ═══════════════════════════════════════════
   布局
   ═══════════════════════════════════════════ */
.app{ flex: 1; display: flex; overflow: hidden; }

/* ── 侧栏 ── */
aside{
  width: 280px; flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
}
.sb-scroll{ flex: 1; overflow-y: auto; padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-4); }
.sb-scroll::-webkit-scrollbar{ width: 6px; }
.sb-scroll::-webkit-scrollbar-thumb{ background: var(--border-strong); border-radius: 3px; }

.panel{
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: var(--sp-4);
}
.ptitle{
  font-size: 12px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-2);
  margin-bottom: var(--sp-3);
  display: flex; align-items: center; gap: var(--sp-2);
}
.ptitle::before{ content:''; width: 3px; height: 14px; border-radius: 2px; background: var(--primary); }

/* 折痕类型选择 */
.lt-grid{ display: flex; flex-direction: column; gap: var(--sp-2); }
.lt-btn{
  display: flex; align-items: center; gap: var(--sp-3);
  min-height: 44px; padding: 0 var(--sp-3);
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  font-weight: 500; text-align: left;
  transition: all .15s;
}
.lt-btn:hover{ border-color: var(--border-strong); }
.lt-btn.active{ border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 1px var(--primary) inset; }
.lt-swatch{
  width: 26px; height: 18px; border-radius: 4px; flex-shrink: 0;
  border: 1px solid rgba(0,0,0,.12);
}
.lt-swatch.valley{ background: repeating-linear-gradient(90deg, var(--fold-valley) 0 6px, transparent 6px 10px); }
.lt-swatch.mountain{ background: var(--fold-mountain); }
.lt-swatch.crease{ background: repeating-linear-gradient(90deg, var(--fold-crease) 0 3px, transparent 3px 6px); }
.lt-badge{
  margin-left: auto; font-size: 11px; font-weight: 700;
  width: 22px; height: 22px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border);
}
.lt-btn.active .lt-badge{ background: var(--primary); color: #fff; border-color: var(--primary); }

/* 滑块行 */
.srow{ display: flex; flex-direction: column; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.srow:last-child{ margin-bottom: 0; }
.slabel{ display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--ink-2); }
.slabel .val{ font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
input[type=range]{
  width: 100%; height: 24px; accent-color: var(--primary); cursor: pointer;
}
.tg-row{ display: flex; gap: var(--sp-2); }
.tg-btn{
  flex: 1; min-height: 40px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 14px; font-weight: 500;
  display: flex; align-items: center; justify-content: center; gap: var(--sp-1);
  transition: all .15s;
}
.tg-btn.on{ background: var(--primary); border-color: var(--primary); color: #fff; }

/* 选择框与色板 */
select{
  width: 100%; min-height: 42px;
  padding: 0 var(--sp-3);
  border-radius: var(--r-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--ink);
  font-size: 15px; font-family: inherit;
}
.color-swatches{ display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--sp-2); }
.color-swatch{
  aspect-ratio: 1; border-radius: 8px;
  border: 1px solid var(--border-strong);
  cursor: pointer; position: relative;
  transition: transform .12s;
}
.color-swatch:hover{ transform: scale(1.1); box-shadow: var(--shadow-sm); }
.color-swatch.active::after{
  content:'✓'; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: rgba(0,0,0,.55); font-size: 14px; font-weight: 700;
}
.color-swatch.custom{
  background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
  display: flex; align-items: center; justify-content: center;
}
.color-swatch.custom::after{ content:'+'; color: rgba(255,255,255,.9); font-size: 18px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.4); }

/* 操作按钮 */
.action-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
.action-grid .btn{ justify-content: center; }

/* 预设 */
.presets-btn{
  width: 100%; min-height: 44px;
  border-radius: var(--r-sm);
  border: 1px dashed var(--border-strong);
  background: var(--surface);
  font-weight: 500;
  display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
  transition: all .15s;
}
.presets-btn:hover{ border-style: solid; border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

/* ── 画布区 ── */
.carea{ flex: 1; position: relative; min-width: 0; display: flex; align-items: center; justify-content: center; }
#cpCanvas{
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: block; cursor: crosshair;
}
.snap-dot, .anchor-dot{
  position: absolute; width: 10px; height: 10px; border-radius: 50%;
  pointer-events: none; display: none;
  transform: translate(-50%, -50%);
}
.snap-dot{ background: var(--primary); box-shadow: 0 0 0 3px rgba(47,93,143,.25); }
.anchor-dot{ background: var(--accent); box-shadow: 0 0 0 3px rgba(194,94,60,.25); }

/* 画布浮层工具栏 */
.cv-toolbar{
  position: absolute; bottom: var(--sp-5); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: var(--sp-1);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: var(--sp-2);
  box-shadow: var(--shadow-md);
  z-index: 15;
}
.cv-toolbar .btn{ border: none; background: transparent; }
.cv-toolbar .btn:hover{ background: var(--surface-2); }
.cv-toolbar .divider{ width: 1px; height: 24px; background: var(--border); margin: 0 var(--sp-1); }

/* 状态栏 */
.statusbar{
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 34px;
  display: flex; align-items: center;
  padding: 0 var(--sp-4);
  font-size: 12.5px; color: var(--ink-2);
  background: linear-gradient(to top, rgba(246,244,239,.95), transparent);
  pointer-events: none; z-index: 10;
  gap: var(--sp-4);
}
.statusbar .sb-item{ display: flex; align-items: center; gap: var(--sp-1); white-space: nowrap; }
.statusbar .sb-spacer{ margin-left: auto; }

/* 帮助弹出 */
.help-pop{
  position: absolute; top: 56px; right: var(--sp-5); z-index: 300;
  width: 320px; max-width: calc(100vw - 32px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--shadow-lg);
  padding: var(--sp-4);
  display: none;
}
.help-pop.show{ display: block; animation: pop .15s ease; }
.help-pop h3{ font-size: 15px; margin-bottom: var(--sp-3); display: flex; align-items: center; gap: var(--sp-2); }
.help-row{ display: flex; justify-content: space-between; align-items: center; padding: var(--sp-1) 0; font-size: 13.5px; }
.help-key{
  font-family: var(--font-mono); font-size: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
  padding: 2px 8px; border-radius: 5px; color: var(--ink);
  display: inline-flex; align-items: center; gap: 4px;
}
.help-desc{ color: var(--ink-2); }
.help-swatch{ display: inline-block; width: 18px; height: 10px; border-radius: 3px; vertical-align: middle; }

/* ── 模态框 ── */
.modal{
  position: fixed; inset: 0; z-index: 500;
  background: rgba(33,29,23,.45);
  display: none; align-items: center; justify-content: center;
  padding: var(--sp-4);
}
.modal.show{ display: flex; }
.modal-card{
  width: 100%; max-width: 560px; max-height: 80vh;
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column;
  animation: pop .18s ease;
}
.modal-head{
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--border);
}
.modal-head h3{ font-size: 16px; }
.modal-body{ padding: var(--sp-5); overflow-y: auto; flex: 1; }
.modal-foot{ padding: var(--sp-4) var(--sp-5); border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: var(--sp-2); }

/* 预设画廊 */
.pg-grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--sp-3); }
.pg-card{
  border: 1px solid var(--border); border-radius: var(--r);
  background: var(--surface-2);
  padding: var(--sp-3);
  text-align: center; cursor: pointer;
  transition: all .15s;
}
.pg-card:hover{ border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.pg-card svg{ display: block; margin: 0 auto var(--sp-2); }
.pg-card .pg-name{ font-weight: 600; font-size: 13.5px; }
.pg-card .pg-desc{ font-size: 12px; color: var(--ink-2); margin-top: 2px; }

/* 拖放区 */
.drop-zone{
  border: 2px dashed var(--border-strong);
  border-radius: var(--r);
  padding: var(--sp-6);
  text-align: center; color: var(--ink-2);
  font-size: 14px;
  transition: all .15s;
}
.drop-zone.drag{ border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
.drop-zone svg{ display: block; margin: 0 auto var(--sp-3); color: var(--ink-3); }

/* 自定义颜色 */
.cc-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); align-items: end; }
.cc-field label{ display: block; font-size: 12px; color: var(--ink-2); margin-bottom: var(--sp-1); font-weight: 600; }
.cc-hex{
  width: 100%; min-height: 42px;
  border: 1px solid var(--border-strong); border-radius: var(--r-sm);
  padding: 0 var(--sp-3); font-family: var(--font-mono); font-size: 15px;
}
.cc-recent{ display: flex; gap: var(--sp-2); margin-top: var(--sp-4); flex-wrap: wrap; }

/* 提示条 */
.toast{
  position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--surface);
  padding: var(--sp-3) var(--sp-5);
  border-radius: 999px;
  font-size: 14px; font-weight: 500;
  box-shadow: var(--shadow-lg);
  opacity: 0; pointer-events: none;
  transition: all .25s ease;
  z-index: 600;
}
.toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── 移动端适配 ── */
@media (max-width: 860px){
  aside{
    position: absolute; z-index: 30; top: 0; bottom: 0; left: 0;
    transform: translateX(-100%);
    transition: transform .22s ease;
    box-shadow: var(--shadow-lg);
  }
  aside.open{ transform: none; }
  .sidebar-backdrop{
    position: absolute; inset: 0; z-index: 25;
    background: rgba(33,29,23,.35);
    display: none;
  }
  .sidebar-backdrop.show{ display: block; }
  .brand-sub{ display: none; }
  header{ padding: 0 var(--sp-3); gap: var(--sp-2); }
  .cv-toolbar{ bottom: var(--sp-3); }
  .statusbar .hide-sm{ display: none; }
  .btn.menu-toggle{ display: inline-flex; }
}
@media (min-width: 861px){ .btn.menu-toggle{ display: none; } .sidebar-backdrop{ display: none !important; } }
</style>
</head>
<body>

<!-- ═══════════ 顶栏 ═══════════ -->
<header>
  <button class="btn icon-btn menu-toggle" onclick="toggleSidebar()" aria-label="打开工具栏">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="brand">
    <div class="brand-icon" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 L21 12 L12 21 L3 12 Z"/>
        <path d="M3 12 L21 12"/><path d="M12 3 L12 21"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">折纸设计工坊</div>
      <div class="brand-sub">Origami Crease Pattern Designer</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn" onclick="openImport()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      导入
    </button>
    <div class="dropdown" id="exportDropdown">
      <button class="btn primary" id="exportBtn" onclick="toggleExportMenu(event)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        导出
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="dropdown-menu">
        <button class="menu-item" onclick="exportSVG()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3 a9 9 0 0 1 9 9"/></svg>
          导出 SVG（矢量）
        </button>
        <div class="menu-divider"></div>
        <button class="menu-item" onclick="exportPDF()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          导出 A4 PDF（打印）
        </button>
      </div>
    </div>
    <button class="btn icon-btn" onclick="toggleHelp()" aria-label="帮助与快捷键" title="帮助 (?)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </button>
  </div>
</header>

<div class="app">

  <!-- ═══════════ 侧栏 ═══════════ -->
  <div class="sidebar-backdrop" id="sbBackdrop" onclick="toggleSidebar()"></div>
  <aside id="sidebar">
    <div class="sb-scroll">

      <!-- 折痕类型 -->
      <div class="panel">
        <div class="ptitle">折痕类型</div>
        <div class="lt-grid">
          <button class="lt-btn active" id="lt-valley" onclick="setLineType('valley')">
            <span class="lt-swatch valley" aria-hidden="true"></span>
            谷折 <span style="color:var(--ink-3);font-size:12px">(虚线)</span>
            <span class="lt-badge">V</span>

<!-- 提示 -->
<div class="toast" id="toast"></div>

<script>
'use strict';
// ═══════════════════════════════════════════
// 状态
// ═══════════════════════════════════════════
const cp = {
  lines: [], hist: [], redoStack: [],
  lineType: 'valley',
  eraseMode: false,
  paperShape: 'square', paperColor: '#FAF6EE',
  gridN: 16, snap: true, gridVis: true,
  zoom: 1, px: 0, py: 0,
  anchor: null,          // 点击放点模式的起点
  SIZE: 400
};

const LINE_STYLES = {
  valley:   { color: '#1F6FD6', dash: [8, 4],  width: 1.8 },
  mountain: { color: '#D64541', dash: [],      width: 1.8 },
  crease:   { color: '#6E6A61', dash: [3, 3],  width: 1.2 }
};

// ═══════════════════════════════════════════
// 工具
// ═══════════════════════════════════════════
const $ = id => document.getElementById(id);
const canvas = $('cpCanvas');
const ctx = canvas.getContext('2d');

function getLuminance(hex){
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const srgb = x => x <= 0.04045 ? x/12.92 : Math.pow((x+0.055)/1.055, 2.4);
  return 0.2126*srgb(r) + 0.7152*srgb(g) + 0.0722*srgb(b);
}
function isDarkPaper(){ return getLuminance(cp.paperColor) < 0.35; }
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 2200);
}

// ═══════════════════════════════════════════
// 坐标变换
// ═══════════════════════════════════════════
function resize(){
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
  render();
}
window.addEventListener('resize', resize);

function screenToWorld(sx, sy){
  const cx = canvas.width/2 + cp.px*devicePixelRatio;
  const cy = canvas.height/2 + cp.py*devicePixelRatio;
  return { x: (sx*devicePixelRatio - cx)/cp.zoom, y: (sy*devicePixelRatio - cy)/cp.zoom };
}
function worldToScreen(wx, wy){
  const cx = canvas.width/2 + cp.px*devicePixelRatio;
  const cy = canvas.height/2 + cp.py*devicePixelRatio;
  return { x: wx*cp.zoom + cx, y: wy*cp.zoom + cy };
}

// ═══════════════════════════════════════════
// 吸附
// ═══════════════════════════════════════════
function lineIntersect(ax,ay,bx,by,cx,cy,dx,dy){
  const d1x=bx-ax, d1y=by-ay, d2x=dx-cx, d2y=dy-cy;
  const denom = d1x*d2y - d1y*d2x;
  if (Math.abs(denom) < 1e-9) return null;
  const t = ((cx-ax)*d2y - (cy-ay)*d2x)/denom;
  return { x: ax + t*d1x, y: ay + t*d1y };
}
function getSnapCandidates(){
  const cands = [];
  const half = cp.SIZE/2, cell = cp.SIZE/cp.gridN;
  for (let i=0;i<=cp.gridN;i++) for (let j=0;j<=cp.gridN;j++)
    cands.push({x:-half+i*cell, y:-half+j*cell});
  for (let i=0;i<cp.lines.length;i++){
    const a = cp.lines[i];
    for (let j=i+1;j<cp.lines.length;j++){
      const b = cp.lines[j];
      const pt = lineIntersect(a.p1.x,a.p1.y,a.p2.x,a.p2.y,b.p1.x,b.p1.y,b.p2.x,b.p2.y);
      if (pt && Math.abs(pt.x)<=half+1 && Math.abs(pt.y)<=half+1) cands.push(pt);
    }
  }
  cp.lines.forEach(l => { cands.push(l.p1); cands.push(l.p2); });
  return cands;
}
function snapPoint(wx, wy){
  if (!cp.snap) return { x: wx, y: wy };
  const half = cp.SIZE/2, cell = cp.SIZE/cp.gridN;
  const gx = Math.max(-half, Math.min(half, Math.round(wx/cell)*cell));
  const gy = Math.max(-half, Math.min(half, Math.round(wy/cell)*cell));
  let best = { x:gx, y:gy };
  let bestD = Math.hypot(wx-gx, wy-gy);
  const snapR = 10/cp.zoom;
  for (const p of getSnapCandidates()){
    const d = Math.hypot(wx-p.x, wy-p.y);
    if (d < bestD && d < snapR){ bestD = d; best = p; }
  }
  return best;
}

// ═══════════════════════════════════════════
// 渲染
// ═══════════════════════════════════════════
function drawGrid(){
  if (!cp.gridVis) return;
  const w = canvas.width, h = canvas.height;
  const cell = (cp.SIZE/cp.gridN)*cp.zoom;
  const ox = w/2 + cp.px*devicePixelRatio, oy = h/2 + cp.py*devicePixelRatio;
  const half = (cp.SIZE/2)*cp.zoom;
  const dark = isDarkPaper();

  ctx.beginPath();
  ctx.strokeStyle = dark ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.05)';
  ctx.lineWidth = 1;
  for (let i=0;i<=cp.gridN;i++){
    const x = ox - half + i*cell, y = oy - half + i*cell;
    if (i !== cp.gridN/2){ ctx.moveTo(x, oy-half); ctx.lineTo(x, oy+half); }
    if (i !== cp.gridN/2){ ctx.moveTo(ox-half, y); ctx.lineTo(ox+half, y); }
  }
  ctx.stroke();
  // 中线
  ctx.beginPath();
  ctx.strokeStyle = dark ? 'rgba(255,255,255,0.30)' : 'rgba(0,0,0,0.14)';
  ctx.lineWidth = 1.5;
  ctx.moveTo(ox, oy-half); ctx.lineTo(ox, oy+half);
  ctx.moveTo(ox-half, oy); ctx.lineTo(ox+half, oy);
  ctx.stroke();
}

function paperPath(){
  const s = cp.SIZE/2;
  ctx.beginPath();
  if (cp.paperShape === 'square'){ ctx.rect(-s,-s,s*2,s*2); }
  else if (cp.paperShape === 'rect'){ ctx.rect(-s,-s/2,s*2,s); }
  else if (cp.paperShape === 'hex'){
    for (let i=0;i<6;i++){ const a = Math.PI/6 + i*Math.PI/3; i ? ctx.lineTo(Math.cos(a)*s, Math.sin(a)*s) : ctx.moveTo(Math.cos(a)*s, Math.sin(a)*s); }
    ctx.closePath();
  }
}

function render(){
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);
  // 背景
  ctx.fillStyle = 'var(--bg)';
  ctx.fillRect(0, 0, w, h);

  const ox = w/2 + cp.px, oy = h/2 + cp.py;
  ctx.save();
  ctx.translate(ox, oy); ctx.scale(cp.zoom, cp.zoom);

  drawGrid();
  // 纸张阴影
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.10)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 5;
  paperPath(); ctx.fillStyle = cp.paperColor; ctx.fill();
  ctx.restore();
  // 纸张描边
  paperPath(); ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1; ctx.stroke();

  // 折痕线
  for (const l of cp.lines) drawLine(l, 1);

  // 正在绘制的线
  if (cp.dragStart && cp.dragEnd) drawLine({
    p1: cp.dragStart, p2: cp.dragEnd,
    lt: cp.lineType
  }, 0.75);

  // 锚点
  if (cp.anchor) ctx.fillStyle = 'rgba(194,94,60,0.6)';
  ctx.restore();

  // 画布外圈淡框
  ctx.strokeStyle = 'rgba(0,0,0,0.05)'; ctx.lineWidth = 1;
  ctx.strokeRect(1, 1, w-2, h-2);
}

function drawLine(l, alpha){
  const st = LINE_STYLES[l.lt] || LINE_STYLES.crease;
  const dark = isDarkPaper();
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = l.lt === 'crease' ? (dark ? '#D8D2C7' : st.color) : st.color;
  ctx.lineWidth = st.width;
  if (st.dash.length) ctx.setLineDash(st.dash);
  ctx.beginPath();
  ctx.moveTo(l.p1.x, l.p1.y);
  ctx.lineTo(l.p2.x, l.p2.y);
  ctx.stroke();
  // 端点圆点
  ctx.setLineDash([]);
  ctx.fillStyle = ctx.strokeStyle;
  ctx.beginPath();
  ctx.arc(l.p1.x, l.p1.y, st.width*0.8, 0, Math.PI*2);
  ctx.arc(l.p2.x, l.p2.y, st.width*0.8, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function eraseNear(pos){
  const R = 8/cp.zoom;
  for (let i=cp.lines.length-1;i>=0;i--){
    const l = cp.lines[i];
    const d1 = Math.hypot(l.p1.x-pos.x, l.p1.y-pos.y);
    const d2 = Math.hypot(l.p2.x-pos.x, l.p2.y-pos.y);
    if (d1 < R || d2 < R){
      cp.hist.push({type:'add', line: l});
      cp.redoStack = [];
      cp.lines.splice(i, 1);
      updateCount();
    }
  }
  render();
}

// ═══════════════════════════════════════════
// 交互
// ═══════════════════════════════════════════
let dragStart = null, dragEnd = null, dragging = false, moved = false;
let panning = false, panBase = null;

function evPos(e){
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('mousedown', e => {
  const pos = evPos(e);
  if (e.button === 1 || e.spaceKey){
    panning = true; panBase = { sx: pos.x, sy: pos.y, px: cp.px, py: cp.py };
    return;
  }
  canvas.focus();
  if (cp.eraseMode){ eraseNear(screenToWorld(pos.x, pos.y)); return; }

  const w = screenToWorld(pos.x, pos.y);
  const s = snapPoint(w.x, w.y);

  if (!cp.anchor){
    // 开始画线：记录起点
    cp.anchor = { x: s.x, y: s.y };
    showAnchor(s);
    $('modeHint').textContent = '已锚定起点，点击终点完成折痕';
  } else {
    // 完成画线
    const d = Math.hypot(s.x-cp.anchor.x, s.y-cp.anchor.y);
    if (d > 0.5){
      cp.hist.push({ type:'add', line:{ p1:{...cp.anchor}, p2:{x:s.x,y:s.y}, lt: cp.lineType } });
      cp.redoStack = [];
      cp.lines.push({ p1:{...cp.anchor}, p2:{x:s.x,y:s.y}, lt: cp.lineType });
      updateCount();
    }
    cp.anchor = null; hideAnchor();
    $('modeHint').textContent = '点击起点 · 再点击终点画线';
    render();
  }
});

canvas.addEventListener('mousemove', e => {
  const pos = evPos(e);
  const w = screenToWorld(pos.x, pos.y);
  const s = snapPoint(w.x, w.y);

  // 状态栏坐标
  $('cursorPos').textContent = `${s.x>=0?'':'−'}${Math.abs(s.x).toFixed(0)}, ${s.y>=0?'':'−'}${Math.abs(s.y).toFixed(0)}`;

  if (panning){
    cp.px = panBase.px + (pos.x - panBase.sx);
    cp.py = panBase.py + (pos.y - panBase.sy);
    render();
    return;
  }

  // 吸附指示
  if (cp.snap && (s.x !== w.x || s.y !== w.y)){
    const sc = worldToScreen(s.x, s.y);
    $('snapDot').style.display = 'block';
    $('snapDot').style.left = sc.x/devicePixelRatio + 'px';
    $('snapDot').style.top = sc.y/devicePixelRatio + 'px';
  } else {
    $('snapDot').style.display = 'none';
  }
});

canvas.addEventListener('mouseup', e => { panning = false; });
canvas.addEventListener('mouseleave', () => { panning = false; $('snapDot').style.display='none'; });

// 滚轮缩放
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const pos = evPos(e);
  const old = cp.zoom;
  cp.zoom = Math.max(0.2, Math.min(6, cp.zoom * (e.deltaY < 0 ? 1.12 : 0.89)));
  const ratio = cp.zoom/old;
  // 以光标为中心缩放
  cp.px = pos.x - (pos.x - cp.px) * ratio;
  cp.py = pos.y - (pos.y - cp.py) * ratio;
  $('zoomVal').textContent = Math.round(cp.zoom*100) + '%';
  render();
}, { passive:false });

// 触屏支持
let touchMode = null, touchStart = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1){
    const t = e.touches[0];
    const r = canvas.getBoundingClientRect();
    touchStart = { x: t.clientX - r.left, y: t.clientY - r.top };
    touchMode = 'draw';
  }
}, { passive:true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2){ e.preventDefault(); }
}, { passive:false });
canvas.addEventListener('touchend', e => {
  if (touchMode === 'draw' && touchStart && e.changedTouches.length === 1){
    const t = e.changedTouches[0];
    const r = canvas.getBoundingClientRect();
    const pos = { x: t.clientX - r.left, y: t.clientY - r.top };
    const moveDist = Math.hypot(pos.x - touchStart.x, pos.y - touchStart.y);
    if (moveDist < 10){
      // 视为点击：锚点/画线
      const w = screenToWorld(pos.x, pos.y);
      const s = snapPoint(w.x, w.y);
      if (!cp.anchor){
        cp.anchor = { x: s.x, y: s.y }; showAnchor(s);
      } else {
        const d = Math.hypot(s.x-cp.anchor.x, s.y-cp.anchor.y);
        if (d > 0.5){
          cp.hist.push({ type:'add', line:{ p1:{...cp.anchor}, p2:{x:s.x,y:s.y}, lt: cp.lineType } });
          cp.redoStack = [];
          cp.lines.push({ p1:{...cp.anchor}, p2:{x:s.x,y:s.y}, lt: cp.lineType });
          updateCount();
        }
        cp.anchor = null; hideAnchor(); render();
      }
    }
  }
  touchMode = null; touchStart = null;
}, { passive:true });

// 空格平移
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat && document.activeElement === document.body){
    canvas.spaceKey = true;
  }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') canvas.spaceKey = false; });

function cpUndo(){
  const h = cp.hist.pop();
  if (!h) return;
  cp.redoStack.push(h);
  if (h.type === 'add'){ const i = cp.lines.indexOf(h.line); if (i>=0) cp.lines.splice(i,1); }
  else if (h.type === 'erase'){ cp.lines.push(h.line); }
  updateCount(); render();
}
function cpRedo(){
  const h = cp.redoStack.pop();
  if (!h) return;
  cp.hist.push(h);
  if (h.type === 'add'){ cp.lines.push(h.line); }
  else if (h.type === 'erase'){ const i = cp.lines.indexOf(h.line); if (i>=0) cp.lines.splice(i,1); }
  updateCount(); render();
}
function cpClear(){
  if (cp.lines.length === 0) return;
  if (!confirm('确定清空全部折痕吗？此操作可撤销。')) return;
  cp.hist.push({ type:'clear', lines: cp.lines.slice() });
  cp.redoStack = [];
  cp.lines = [];
  updateCount(); render();
  toast('已清空（Ctrl+Z 可撤销）');
}

}

function buildPresetGallery(){
  const grid = $('pgGrid');
  const s = cp.SIZE/2;
  grid.innerHTML = '';
  for (const key of Object.keys(PRESET_DATA)){
    const data = PRESET_DATA[key];
    const lines = data.lines(s);
    const min = -s-10, max = s+10, range = max-min, size = 110;
    const scale = size/range;
    let svg = '';
    for (const l of lines){
      const st = LINE_STYLES[l.lt];
      const dash = st.dash.length ? `stroke-dasharray="${st.dash.join(' ')}"` : '';
      const x1 = (l.p1.x-min)*scale, y1 = (l.p1.y-min)*scale;
      const x2 = (l.p2.x-min)*scale, y2 = (l.p2.y-min)*scale;
      svg += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${st.color}" stroke-width="1.6" ${dash}/>`;
    }
    const card = document.createElement('div');
    card.className = 'pg-card';
    card.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <rect x="2" y="2" width="${size-4}" height="${size-4}" fill="#FDFCF9" stroke="#DDD6C8" rx="6"/>
        ${svg}</svg>
      <div class="pg-name">${data.name}</div>
      <div class="pg-desc">${data.desc}</div>`;
    card.onclick = () => { loadPreset(key); closePresetsGallery(); };
    grid.appendChild(card);
  }
}

function openImport(){ $('importModal').classList.add('show'); }
function closeImport(){ $('importModal').classList.remove('show'); }
const dropZone = $('dropZone');
dropZone.addEventListener('click', () => $('fileInput').click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));

  e.preventDefault();
  dropZone.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file){
  if (!file || !file.name.toLowerCase().endsWith('.svg')){
    toast('请选择 SVG 文件'); return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const doc = new DOMParser().parseFromString(e.target.result, 'image/svg+xml');
      const lines = [];
      let vb = { x: -200, y: -200, w: 400, h: 400 };
      const svgEl = doc.querySelector('svg');
      if (svgEl){
        const vbStr = svgEl.getAttribute('viewBox');
        if (vbStr){
          const parts = vbStr.split(/[\s,]+/).map(Number);
          if (parts.length === 4) vb = { x: parts[0], y: parts[1], w: parts[2], h: parts[3] };
        }
      }
      const svgSize = Math.max(vb.w, vb.h);
      const scale = cp.SIZE / svgSize;
      const offsetX = -vb.x - vb.w/2;
      const offsetY = -vb.y - vb.h/2;

      doc.querySelectorAll('line').forEach(el => {
        const x1 = parseFloat(el.getAttribute('x1'))||0, y1 = parseFloat(el.getAttribute('y1'))||0;
        const x2 = parseFloat(el.getAttribute('x2'))||0, y2 = parseFloat(el.getAttribute('y2'))||0;
        const stroke = (el.getAttribute('stroke')||'#000').toLowerCase();
        let lt = 'crease';
        if (stroke.includes('3b82f6') || stroke.includes('#00f') || stroke.includes('blue')) lt = 'valley';
        if (stroke.includes('ef4444') || stroke.includes('#f00') || stroke.includes('red')) lt = 'mountain';
        lines.push({ p1:{ x:(x1+offsetX)*scale, y:(y1+offsetY)*scale },
                     p2:{ x:(x2+offsetX)*scale, y:(y2+offsetY)*scale }, lt });
      });
      doc.querySelectorAll('path').forEach(el => {
        const d = el.getAttribute('d') || '';
        const stroke = (el.getAttribute('stroke')||'#000').toLowerCase();
        let lt = 'crease';
        if (stroke.includes('3b82f6') || stroke.includes('#00f') || stroke.includes('blue')) lt = 'valley';
        if (stroke.includes('ef4444') || stroke.includes('#f00') || stroke.includes('red')) lt = 'mountain';
        const matches = d.match(/[ML]\s*([\d.-]+)[,\s]+([\d.-]+)/gi);
        if (matches){
          const pts = matches.map(m => {
            const nums = m.match(/([\d.-]+)/g);
            return { x: parseFloat(nums[nums.length-2]), y: parseFloat(nums[nums.length-1]) };
          });
          for (let i=1;i<pts.length;i++){
            lines.push({ p1:{ x:(pts[i-1].x+offsetX)*scale, y:(pts[i-1].y+offsetY)*scale },
                         p2:{ x:(pts[i].x+offsetX)*scale, y:(pts[i].y+offsetY)*scale }, lt });
          }
        }
      });

      if (lines.length === 0){ toast('SVG 中未找到可识别的折痕线'); return; }
      cp.hist.push({ type:'clear', lines: cp.lines.slice() });
      cp.redoStack = [];
      cp.lines = lines;
      updateCount(); render();
      closeImport();
      toast(`已导入 ${lines.length} 条折痕`);
    } catch(err){
      toast('SVG 解析失败：' + err.message);
    }
  };
  reader.readAsText(file);
}

function svgContent(){
  const s = cp.SIZE/2;
  let lines = '';
  for (const l of cp.lines){
    const st = LINE_STYLES[l.lt] || LINE_STYLES.crease;
    const dash = st.dash.length ? `stroke-dasharray="${st.dash.join(' ')}"` : '';
    lines += `  <line x1="${l.p1.x.toFixed(2)}" y1="${l.p1.y.toFixed(2)}" x2="${l.p2.x.toFixed(2)}" y2="${l.p2.y.toFixed(2)}" stroke="${st.color}" stroke-width="${st.width}" ${dash}/>\n`;
  }
  let paper = '';
  if (cp.paperShape === 'square'){
    paper = `<rect x="${-s}" y="${-s}" width="${s*2}" height="${s*2}" fill="${cp.paperColor}" stroke="#333" stroke-width="1.5"/>`;
  } else if (cp.paperShape === 'rect'){
    paper = `<rect x="${-s}" y="${-s/2}" width="${s*2}" height="${s}" fill="${cp.paperColor}" stroke="#333" stroke-width="1.5"/>`;
  } else if (cp.paperShape === 'hex'){
    const pts = [];
    for (let i=0;i<6;i++){ const a = Math.PI/6 + i*Math.PI/3; pts.push(`${(Math.cos(a)*s).toFixed(2)},${(Math.sin(a)*s).toFixed(2)}`); }
    paper = `<polygon points="${pts.join(' ')}" fill="${cp.paperColor}" stroke="#333" stroke-width="1.5"/>`;
  }
  return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${cp.SIZE}" height="${cp.SIZE}" viewBox="${-s} ${-s} ${cp.SIZE} ${cp.SIZE}">\n${paper}\n${lines}</svg>`;
}

function downloadBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 300);
}

function exportSVG(){
  const blob = new Blob([svgContent()], { type: 'image/svg+xml' });
  downloadBlob(blob, 'crease-pattern.svg');
  $('exportDropdown').classList.remove('open');
  toast('已导出 SVG');
}

function exportPDF(){
  const a4w = 2480, a4h = 3508, margin = 60;
  const drawW = a4w - margin*2, drawH = a4h - margin*2;
  let scale;
  if (cp.paperShape === 'rect') scale = Math.min(drawW/(cp.SIZE), drawH/(cp.SIZE/2));
  else scale = Math.min(drawW/cp.SIZE, drawH/cp.SIZE);
  const size = cp.SIZE * scale;

  const off = document.createElement('canvas');
  off.width = a4w; off.height = a4h;
  const oc = off.getContext('2d');
  oc.fillStyle = '#FFFFFF'; oc.fillRect(0, 0, a4w, a4h);
  oc.translate((a4w-size)/2, (a4h-size)/2);
  oc.scale(scale, scale);
  const s = cp.SIZE/2;
  oc.save();
  oc.shadowColor = 'rgba(0,0,0,0.12)'; oc.shadowBlur = 30; oc.shadowOffsetY = 6;
  oc.beginPath();
  if (cp.paperShape === 'square') oc.rect(-s,-s,s*2,s*2);
  else if (cp.paperShape === 'rect') oc.rect(-s,-s/2,s*2,s);
  else if (cp.paperShape === 'hex'){
    for (let i=0;i<6;i++){ const a = Math.PI/6 + i*Math.PI/3; i ? oc.lineTo(Math.cos(a)*s, Math.sin(a)*s) : oc.moveTo(Math.cos(a)*s, Math.sin(a)*s); }
    oc.closePath();
  }
  oc.fillStyle = cp.paperColor; oc.fill();
  oc.restore();
  oc.beginPath();
  if (cp.paperShape === 'square') oc.rect(-s,-s,s*2,s*2);
  else if (cp.paperShape === 'rect') oc.rect(-s,-s/2,s*2,s);
  else if (cp.paperShape === 'hex'){
    for (let i=0;i<6;i++){ const a = Math.PI/6 + i*Math.PI/3; i ? oc.lineTo(Math.cos(a)*s, Math.sin(a)*s) : oc.moveTo(Math.cos(a)*s, Math.sin(a)*s); }
    oc.closePath();
  }
  oc.strokeStyle = 'rgba(0,0,0,0.25)'; oc.lineWidth = 1.5; oc.stroke();
  for (const l of cp.lines){
    const st = LINE_STYLES[l.lt] || LINE_STYLES.crease;
    oc.strokeStyle = st.color; oc.lineWidth = st.width*2;
    oc.setLineDash(st.dash.map(d => d*2));
    oc.beginPath(); oc.moveTo(l.p1.x, l.p1.y); oc.lineTo(l.p2.x, l.p2.y); oc.stroke();
  }
  oc.setLineDash([]);

  const dataUrl = off.toDataURL('image/png', 1.0);
  const str = `data:application/pdf;base64,${makePDF(dataUrl, a4w, a4h)}`;
  const a = document.createElement('a');
  a.href = str; a.download = 'crease-pattern.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  $('exportDropdown').classList.remove('open');
  toast('已导出 A4 PDF');
}

// 简易 PDF 生成（PNG 图片嵌入 A4 页）
function makePDF(imgDataUrl, w, h){
  // 提取 PNG 的 base64 数据（去掉 data:image/png;base64, 前缀）
  const base64 = imgDataUrl.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);

  const imgW = w, imgH = h; // A4 @300dpi ≈ 2480×3508
  const xobj = '2 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + imgW + ' /Height ' + imgH +
    ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /FlateDecode /Length ' + '____' + ' >>\nstream\n';

  // 用 Canvas 转 RGB：off canvas 已经是 RGB，直接转成原始 RGB 并压缩
  // 这里简化：用原始 PNG 字节（PDF 支持 PNG 过滤需 PNG 头处理复杂），改为生成 JPEG 更简单
  // —— 采用折中方案：以 PNG 原样嵌入（Acrobat 一般可读），或回退为直接下载 PNG
  return makePDFFallback(imgDataUrl);
}

function makePDFFallback(imgDataUrl){
  // 简化实现：导出 PNG（多数浏览器可打印），并尝试生成最小 PDF 壳
  const base64 = imgDataUrl.split(',')[1];
  const raw = atob(base64);
  const n = raw.length;
  let pdf = '%PDF-1.4\n';
  const objs = [];
  objs.push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  objs.push('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  objs.push('3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n');
  objs.push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width 595 /Height 842 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${n} >>\nstream\n${raw}\nendstream\nendobj\n`);
  objs.push('5 0 obj\n<< /Length 66 >>\nstream\nq 595.28 0 0 841.89 0 0 cm /Im0 Do Q\nendstream\nendobj\n');
  let offset = pdf.length;
  const offsets = [0];
  for (let i=0;i<objs.length;i++){
    offsets.push(offset);
    pdf += objs[i];
    offset += objs[i].length;
  }
  const xrefStart = pdf.length;
  pdf += 'xref\n0 ' + (objs.length+1) + '\n';
  pdf += '0000000000 65535 f \n';
  for (let i=1;i<=objs.length;i++){
    pdf += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  }
  pdf += 'trailer\n<< /Size ' + (objs.length+1) + ' /Root 1 0 R >>\nstartxref\n' + xrefStart + '\n%%EOF';
  return btoa(pdf);
}

// ═══════════════════════════════════════════
// 自定义颜色
// ═══════════════════════════════════════════
let ccRecent = [];
function openCustomColorPicker(){ renderCCRecent(); $('colorModal').classList.add('show'); }
function closeCustomColorPicker(){ $('colorModal').classList.remove('show'); }
function onCCHexInput(v){
  if (/^#[0-9a-fA-F]{6}$/.test(v)) $('ccNativeColor').value = v;
}
function onCCNativeChange(v){ $('ccHexInput').value = v.toUpperCase(); }
function confirmCustomColor(){
  const hex = $('ccHexInput').value;
  if (!/^#[0-9a-fA-F]{6}$/.test(hex)){ toast('请输入 #RRGGBB 格式'); return; }
  setPaperColor(hex.toLowerCase());
  ccRecent.unshift(hex.toLowerCase());
  ccRecent = [...new Set(ccRecent)].slice(0, 8);
  closeCustomColorPicker();
  toast('纸张颜色已更新');
}
function renderCCRecent(){
  const box = $('ccRecent');
  box.innerHTML = '';
  if (ccRecent.length === 0){
    box.innerHTML = '<span style="font-size:12.5px;color:var(--ink-3)">最近使用的颜色会显示在这里</span>';
    return;
  }
  for (const c of ccRecent){
    const el = document.createElement('div');
    el.className = 'color-swatch';
    el.style.background = c;
    el.style.width = '34px'; el.style.aspectRatio = 'auto';
    el.style.height = '34px';
    el.title = c;
    el.onclick = () => { setPaperColor(c); closeCustomColorPicker(); };
    box.appendChild(el);
  }
}

// ═══════════════════════════════════════════
// 快捷键
// ═══════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.ctrlKey && (e.key === 'z' || e.key === 'Z')){ e.preventDefault(); cpUndo(); }
  if (e.ctrlKey && (e.key === 'y' || e.key === 'Y')){ e.preventDefault(); cpRedo(); }
  if (e.key === 'e' && !e.ctrlKey && !e.metaKey && document.activeElement === document.body){ toggleErase(); }
  if (!e.ctrlKey && !e.metaKey && document.activeElement === document.body){
    if (e.key === '1') setLineType('valley');
    if (e.key === '2') setLineType('mountain');
    if (e.key === '3') setLineType('crease');
  }
  if (e.key === 'Escape'){
    closeImport(); closePresetsGallery(); closeCustomColorPicker();
    $('helpPopover').classList.remove('show'); $('exportDropdown').classList.remove('open');
    cp.anchor = null; hideAnchor(); render();
  }
});

function init(){
  resize();
  updateCount();
  canvas.focus();
}
window.addEventListener('DOMContentLoaded', init);
